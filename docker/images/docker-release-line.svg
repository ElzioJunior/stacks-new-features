<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title desc">
  <title id="title">Docker Engine release line since 2018</title>
  <desc id="desc">Timeline of Docker Engine stable release branches from 18.09 through 29.</desc>
  <rect width="980" height="280" fill="#f8fafc"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Docker Engine stable release landmarks</text>
  <line x1="80" y1="138" x2="900" y2="138" stroke="#334155" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="100" cy="138" r="16" fill="#2563eb"/>
    <text x="100" y="184" font-size="18" font-weight="700" fill="#111827">18.09</text>
    <text x="100" y="207" font-size="13" fill="#475569">2018</text>
    <circle cx="220" cy="138" r="16" fill="#0891b2"/>
    <text x="220" y="184" font-size="18" font-weight="700" fill="#111827">19.03</text>
    <text x="220" y="207" font-size="13" fill="#475569">2019</text>
    <circle cx="350" cy="138" r="16" fill="#059669"/>
    <text x="350" y="184" font-size="18" font-weight="700" fill="#111827">20.10</text>
    <text x="350" y="207" font-size="13" fill="#475569">2020</text>
    <circle cx="500" cy="138" r="16" fill="#d97706"/>
    <text x="500" y="184" font-size="18" font-weight="700" fill="#111827">23/24</text>
    <text x="500" y="207" font-size="13" fill="#475569">2023</text>
    <circle cx="660" cy="138" r="16" fill="#7c3aed"/>
    <text x="660" y="184" font-size="18" font-weight="700" fill="#111827">25-27</text>
    <text x="660" y="207" font-size="13" fill="#475569">2024</text>
    <circle cx="820" cy="138" r="16" fill="#dc2626"/>
    <text x="820" y="184" font-size="18" font-weight="700" fill="#111827">28/29</text>
    <text x="820" y="207" font-size="13" fill="#475569">2025</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155">
    <text x="80" y="95">containerd lifecycle</text>
    <text x="300" y="95">cleanup + API v1.41</text>
    <text x="465" y="95">SemVer + plugins</text>
    <text x="620" y="95">networking + OCI</text>
    <text x="760" y="95">image store shift</text>
  </g>
</svg>
