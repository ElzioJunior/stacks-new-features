<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">Docker and containerd lifecycle</title>
  <desc id="desc">Docker Engine 18.09 manages containerd through systemd rather than only through dockerd.</desc>
  <rect width="880" height="340" fill="#f8fafc"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Docker 18.09: containerd gets its own service lifecycle</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="92" width="250" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="128" y="124" font-size="20" font-weight="700" fill="#1e3a8a">Before 18.09</text>
    <text x="104" y="150" font-size="16" fill="#334155">dockerd manages containerd</text>
    <rect x="560" y="92" width="250" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="620" y="124" font-size="20" font-weight="700" fill="#14532d">From 18.09</text>
    <text x="590" y="150" font-size="16" fill="#334155">systemd manages containerd</text>
    <rect x="90" y="220" width="190" height="58" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="133" y="256" font-size="18" fill="#0c4a6e">dockerd</text>
    <rect x="600" y="220" width="190" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="646" y="256" font-size="18" fill="#78350f">containerd</text>
    <line x1="320" y1="131" x2="560" y2="131" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="384" y="118" font-size="15" fill="#475569">service boundary</text>
    <text x="70" y="310" font-size="15" fill="#475569">Custom systemd overrides need review during upgrades.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
