<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">Docker backend workflow</title>
  <desc id="desc">Backend source code builds into an image, runs as an API container, and connects to local service dependencies with Compose.</desc>
  <rect width="980" height="390" fill="#f8fafc"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Docker as a backend development workflow</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="92" width="170" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="103" y="134" font-size="18" fill="#1e3a8a">Source code</text>
    <line x1="230" y1="128" x2="310" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="310" y="92" width="170" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="355" y="134" font-size="18" fill="#14532d">Dockerfile</text>
    <line x1="480" y1="128" x2="560" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="92" width="170" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="610" y="134" font-size="18" fill="#78350f">Image</text>
    <line x1="730" y1="128" x2="810" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="810" y="92" width="120" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="836" y="134" font-size="18" fill="#7f1d1d">API</text>
    <rect x="225" y="245" width="530" height="92" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="398" y="278" font-size="20" font-weight="700" fill="#164e63">Docker Compose local environment</text>
    <text x="286" y="313" font-size="16" fill="#334155">API + PostgreSQL + Redis + queue + object storage emulator</text>
    <line x1="870" y1="164" x2="690" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="645" y1="164" x2="515" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="60" y="365" font-size="15" fill="#475569">The backend value is repeatability: every developer and CI job can run the same service shape.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
