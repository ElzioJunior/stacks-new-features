<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Kafka Streams service</title>
  <desc id="desc">A backend Kafka Streams service reads an input topic, keeps local state, and writes an output topic.</desc>
  <rect width="900" height="340" fill="#f8fafc"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Kafka Streams inside a backend service</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="105" width="180" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="113" y="145" font-size="17" fill="#1e3a8a">input topic</text>
    <line x1="250" y1="139" x2="340" y2="139" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="340" y="84" width="220" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="390" y="124" font-size="18" font-weight="700" fill="#14532d">Streams app</text>
    <text x="384" y="155" font-size="15" fill="#334155">filter, join, aggregate</text>
    <line x1="560" y1="139" x2="650" y2="139" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="650" y="105" width="180" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="689" y="145" font-size="17" fill="#78350f">output topic</text>
    <rect x="350" y="235" width="200" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="396" y="268" font-size="16" fill="#4c1d95">local state store</text>
    <line x1="450" y1="194" x2="450" y2="235" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
