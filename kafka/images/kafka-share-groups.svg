<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="title desc">
  <title id="title">Kafka share groups</title>
  <desc id="desc">Share groups allow queue-style processing where many workers cooperatively process records.</desc>
  <rect width="940" height="360" fill="#f8fafc"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Share groups: queue-style processing for Kafka</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="94" width="240" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="132" y="140" font-size="18" fill="#14532d">Kafka topic</text>
    <line x1="310" y1="134" x2="430" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="430" y="94" width="190" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="473" y="140" font-size="18" fill="#1e3a8a">Share group</text>
    <line x1="620" y1="134" x2="720" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="620" y1="134" x2="720" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="620" y1="134" x2="720" y2="178" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="720" y="60" width="150" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="766" y="91" font-size="16" fill="#78350f">worker</text>
    <rect x="720" y="120" width="150" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="766" y="151" font-size="16" fill="#78350f">worker</text>
    <rect x="720" y="180" width="150" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="766" y="211" font-size="16" fill="#78350f">worker</text>
    <text x="70" y="310" font-size="15" fill="#475569">Use this for work queues; keep normal consumer groups for ordered stream processing.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
