<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Kafka KRaft</title>
  <desc id="desc">KRaft replaces ZooKeeper with a Kafka controller quorum for metadata.</desc>
  <rect width="900" height="340" fill="#f8fafc"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">KRaft: Kafka metadata without ZooKeeper</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="92" width="250" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="137" y="135" font-size="18" fill="#7f1d1d">Old: ZooKeeper</text>
    <line x1="330" y1="128" x2="560" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="92" width="250" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="604" y="135" font-size="18" fill="#14532d">New: controller quorum</text>
    <rect x="245" y="225" width="410" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="314" y="262" font-size="18" fill="#1e3a8a">Backend clients still use bootstrap.servers</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
